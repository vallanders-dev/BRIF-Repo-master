# Netlify configuration for the BRIF Astro site
[build]
  command = "npm run build"
  publish = "dist"

# Astro 7 requires Node >=22.12.0 (bumped from 20 when the site upgraded
# from Astro v4 to v7 — see that commit for the full migration notes).
[build.environment]
  NODE_VERSION = "22"

# Send the bare root straight to the English site (instant, server-level).
# The built /index.html also does this via meta-refresh as a fallback.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false
