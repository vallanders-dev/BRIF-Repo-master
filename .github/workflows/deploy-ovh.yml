name: Deploy to OVH

# Every push to master builds the site and uploads it to OVH shared hosting.
# After the one-time secret setup (see below), deploys need no intervention.
#
# Required repository secrets — Settings > Secrets and variables > Actions:
#   OVH_FTP_SERVER    e.g. ftp.cluster021.hosting.ovh.net
#   OVH_FTP_USERNAME  your OVH FTP login
#   OVH_FTP_PASSWORD  your OVH FTP password
#
# Never commit these values to the repo. GitHub masks them in logs.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  # If two pushes land close together, let the newer one win rather than
  # racing two uploads into the same directory.
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Confirm the build produced what we expect
        # Cheap guard against uploading a broken or empty tree: if the build
        # silently produced nothing, fail here rather than wiping the live site.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "dist/404.html missing"; exit 1; }
          test -f dist/.htaccess  || { echo "dist/.htaccess missing"; exit 1; }
          test -d dist/en         || { echo "dist/en missing"; exit 1; }
          test -d dist/fr         || { echo "dist/fr missing"; exit 1; }
          echo "Build looks sane: $(find dist -type f | wc -l) files."

      - name: Upload to OVH over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          # OVH shared hosting rejects explicit FTPS ("AUTH TLS" on port 21)
          # with "500 This security scheme is not implemented" — it expects
          # implicit FTPS instead (TLS from the start, typically port 990).
          protocol: ftps-legacy
          port: 990
          local-dir: ./dist/
          # OVH shared hosting serves from www/. Adjust if your plan differs.
          server-dir: ./www/
          # The action keeps a sync-state file on the server and uploads only
          # what changed, so routine deploys are seconds rather than minutes.
          # It also means the first run uploads everything.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
