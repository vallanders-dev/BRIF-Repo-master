name: Deploy to OVH

# Every push to master builds the site and uploads it to OVH shared hosting
# over SFTP (see the deploy step below for why SFTP rather than FTP/FTPS).
# After the one-time secret setup (see below), deploys need no intervention.
#
# Required repository secrets — Settings > Secrets and variables > Actions:
#   OVH_FTP_SERVER    the SAME host used for FTP, e.g. ftp.cluster021.hosting.ovh.net
#                     (OVH shared hosting typically answers SSH/SFTP on this
#                     same hostname too; if the control panel's SFTP tab
#                     shows a different host, use that one instead)
#   OVH_FTP_USERNAME  your OVH FTP/SSH login
#   OVH_FTP_PASSWORD  your OVH FTP/SSH password
#
# Never commit these values to the repo. GitHub masks them in logs.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  # If two pushes land close together, let the newer one win rather than
  # racing two uploads into the same directory.
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Confirm the build produced what we expect
        # Cheap guard against uploading a broken or empty tree: if the build
        # silently produced nothing, fail here rather than wiping the live site.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "dist/404.html missing"; exit 1; }
          test -f dist/.htaccess  || { echo "dist/.htaccess missing"; exit 1; }
          test -d dist/en         || { echo "dist/en missing"; exit 1; }
          test -d dist/fr         || { echo "dist/fr missing"; exit 1; }
          echo "Build looks sane: $(find dist -type f | wc -l) files."

      - name: Upload to OVH over SFTP
        # This plan's OVH control panel lists only plain FTP (21, no TLS
        # upgrade available — confirmed by "500 This security scheme is not
        # implemented" on explicit FTPS, then a connection timeout on
        # implicit FTPS/990, since nothing listens there) and SFTP (22).
        # SFTP is the only encrypted option this plan actually offers, so
        # that's what's used here, over SSH rather than the FTP family.
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          port: 22
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local_path: './dist/*'
          # OVH shared hosting serves from www/. Adjust if your plan differs.
          remote_path: './www/'
          # OVH shared hosting is an SFTP-only jail with no shell, so the
          # action's default (rsync over ssh) won't work here — this forces
          # plain SFTP puts instead.
          sftp_only: true
